name: Portfolio CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: portfolio-ci-${{ github.ref }}
  cancel-in-progress: true

env:
  NEXORA_DIR: nexora-ai-operations-platform
  DOCINTEL_DIR: document-intelligence-pipeline
  EVALFORGE_DIR: llm-evaluation-lab
  AUTOMATION_DIR: ai-automation-pack

jobs:
  nexora-backend:
    name: Nexora backend · Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexora-ai-operations-platform/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: nexora-ai-operations-platform/backend/pyproject.toml

      - name: Install backend with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests alembic

      - name: Test
        env:
          NEXORA_ENVIRONMENT: test
          NEXORA_AI_PROVIDER_MODE: mock
        run: python -m pytest

  nexora-frontend:
    name: Nexora frontend · typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: nexora-ai-operations-platform/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: nexora-ai-operations-platform/frontend/pnpm-lock.yaml

      - name: Install frontend dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: pnpm run build

  nexora-containers:
    name: Nexora Docker · validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: nexora-ai-operations-platform
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend

  docintel-backend:
    name: DocIntel backend · Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: document-intelligence-pipeline/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: document-intelligence-pipeline/backend/pyproject.toml

      - name: Install backend with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Test
        env:
          DOCINTEL_ENVIRONMENT: test
          DOCINTEL_PROVIDER_MODE: mock
          DOCINTEL_SEED_DEMO: "false"
        run: python -m pytest

  docintel-frontend:
    name: DocIntel frontend · typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: document-intelligence-pipeline/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: document-intelligence-pipeline/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: pnpm run build

  docintel-containers:
    name: DocIntel Docker · validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: document-intelligence-pipeline
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend

  evalforge-backend:
    name: EvalForge backend · Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-evaluation-lab/backend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: llm-evaluation-lab/backend/pyproject.toml

      - name: Install backend with development dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[dev]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Test
        run: python -m pytest

  evalforge-frontend:
    name: EvalForge frontend · typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: llm-evaluation-lab/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: llm-evaluation-lab/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: pnpm run build

  evalforge-containers:
    name: EvalForge Docker · validate and build
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: llm-evaluation-lab
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend

  automation-backend:
    name: Automation Pack backend · Ruff and pytest
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-automation-pack/automation-api
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: ai-automation-pack/automation-api/pyproject.toml

      - name: Install backend with test dependencies
        run: python -m pip install --upgrade pip && python -m pip install -e ".[test]"

      - name: Lint
        run: python -m ruff check app tests

      - name: Test
        run: python -m pytest

  automation-frontend:
    name: Automation Pack frontend · typecheck, test, and build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: ai-automation-pack/frontend
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.19.0

      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: pnpm
          cache-dependency-path: ai-automation-pack/frontend/pnpm-lock.yaml

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm run typecheck

      - name: Test
        run: pnpm run test

      - name: Build
        env:
          VITE_API_BASE_URL: /api/v1
        run: pnpm run build

  automation-workflows-and-containers:
    name: Automation Pack workflows and Docker
    runs-on: ubuntu-latest
    timeout-minutes: 25
    defaults:
      run:
        working-directory: ai-automation-pack
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Validate n8n workflow exports
        run: python -B scripts/validate_workflows.py

      - name: Validate Compose model
        run: docker compose --env-file .env.example config --quiet

      - name: Build application images
        run: docker compose --env-file .env.example build backend frontend
