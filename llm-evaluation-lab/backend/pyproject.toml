[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "evalforge-backend"
version = "0.1.0"
description = "Reproducible LLM, prompt and RAG evaluation service"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "pandas>=2.2,<3",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-asyncio>=0.24,<1",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"
asyncio_mode = "auto"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008", "EXE002"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
