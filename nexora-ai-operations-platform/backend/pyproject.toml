[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "nexora-backend"
version = "0.1.0"
description = "Production-oriented AI operations API for Nexora"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<3",
  "alembic>=1.14,<2",
  "psycopg[binary]>=3.2,<4",
  "pgvector>=0.3.5,<1",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "pypdf>=5,<6",
  "Pillow>=10,<12",
  "pypdfium2>=4.30,<5",
  "pytesseract>=0.3.13,<1",
  "structlog>=24.4,<26",
]

[project.optional-dependencies]
dev = [
  "pytest>=8.3,<9",
  "pytest-cov>=5,<7",
  "ruff>=0.7,<1",
]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]

[tool.ruff.lint.isort]
known-first-party = ["app"]
known-third-party = ["alembic"]

[tool.coverage.run]
source = ["app"]
branch = true


