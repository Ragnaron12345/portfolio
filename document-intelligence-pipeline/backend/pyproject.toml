[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "docintel-backend"
version = "1.0.0"
description = "Explainable document intelligence pipeline"
requires-python = ">=3.12"
dependencies = [
  "fastapi>=0.115,<1",
  "uvicorn[standard]>=0.30,<1",
  "pydantic>=2.9,<3",
  "pydantic-settings>=2.5,<3",
  "sqlalchemy>=2.0.35,<3",
  "psycopg[binary]>=3.2,<4",
  "httpx>=0.27,<1",
  "python-multipart>=0.0.12,<1",
  "PyMuPDF>=1.24,<2",
  "pypdf>=5,<6",
  "Pillow>=10,<13",
  "pypdfium2>=4.30,<6",
  "pytesseract>=0.3.13,<1",
  "structlog>=24.4,<27",
]

[project.optional-dependencies]
dev = ["pytest>=8.3,<9", "pytest-cov>=5,<8", "ruff>=0.7,<1"]

[tool.hatch.build.targets.wheel]
packages = ["app"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers --disable-warnings"

[tool.ruff]
target-version = "py312"
line-length = 120

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["B008"]
